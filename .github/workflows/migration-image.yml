name: Build database migration image

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/migration-image.yml"
      - "job portal backend/migration/**"

permissions:
  contents: read
  packages: write

jobs:
  build:
    name: Publish PostgreSQL migration image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and publish immutable migration image
        uses: docker/build-push-action@v6
        with:
          context: job portal backend/migration
          file: job portal backend/migration/Dockerfile
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/job-portal-migration:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
