name: CI and production deployment

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-tests:
    name: Backend tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: job portal backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: job portal backend/requirements.txt
      - run: pip install -r requirements.txt
      - run: pytest -q

  frontend-tests:
    name: Frontend lint and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: job portal frontend
    env:
      NEXT_PUBLIC_API_URL: http://127.0.0.1:4010
      INTERNAL_API_URL: http://127.0.0.1:4010
      NEXT_PUBLIC_SITE_URL: http://localhost:3000
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: job portal frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - name: Install dashboard smoke-test browser
        run: npx playwright install --with-deps chromium
      - name: Smoke-test every admin dashboard route
        run: npm run test:e2e

  deploy-backend:
    name: Deploy backend to Azure Container Apps
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: [backend-tests, frontend-tests]
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate immutable image metadata
        id: image
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/job-portal-backend
          tags: type=sha,format=long,prefix=

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push backend image
        uses: docker/build-push-action@v6
        with:
          context: job portal backend
          file: job portal backend/Dockerfile
          push: true
          tags: ${{ steps.image.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Log in to Azure with OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Verify persistent Qwen3 Embedding storage
        run: |
          MODEL_MOUNT=$(az containerapp show \
            --name "${{ vars.AZURE_CONTAINER_APP_NAME }}" \
            --resource-group "${{ vars.AZURE_RESOURCE_GROUP }}" \
            --query "properties.template.containers[0].volumeMounts[?mountPath=='/models'].mountPath | [0]" \
            --output tsv)
          if [ "$MODEL_MOUNT" != "/models" ]; then
            echo "Missing persistent Azure Files volume mounted at /models."
            echo "Complete the Qwen3 Embedding storage step in deployment.md before deploying."
            exit 1
          fi

      - name: Deploy immutable backend revision
        run: |
          az containerapp revision set-mode \
            --name "${{ vars.AZURE_CONTAINER_APP_NAME }}" \
            --resource-group "${{ vars.AZURE_RESOURCE_GROUP }}" \
            --mode single

          az containerapp ingress update \
            --name "${{ vars.AZURE_CONTAINER_APP_NAME }}" \
            --resource-group "${{ vars.AZURE_RESOURCE_GROUP }}" \
            --target-port 8000

          az containerapp update \
            --name "${{ vars.AZURE_CONTAINER_APP_NAME }}" \
            --resource-group "${{ vars.AZURE_RESOURCE_GROUP }}" \
            --image "${{ steps.image.outputs.tags }}" \
            --cpu 0.5 \
            --memory 1.0Gi \
            --set-env-vars \
              APP_ENV=production \
              R2_LOGS_ENABLED=true \
              R2_LOG_PREFIX=production-logs \
              R2_LOG_MAX_BYTES=104857600 \
              R2_LOG_RETENTION_DAYS=2 \
              QWEN3_EMBEDDING_MODEL_PATH=/models/Qwen3-Embedding-0.6B-Q8_0.gguf \
              QWEN3_EMBEDDING_MODEL_MOUNT_PATH=/models \
              QWEN3_EMBEDDING_REQUIRE_PERSISTENT_STORAGE=true \
              QWEN3_EMBEDDING_THREADS=1

      - name: Verify backend readiness
        run: |
          FQDN=$(az containerapp show \
            --name "${{ vars.AZURE_CONTAINER_APP_NAME }}" \
            --resource-group "${{ vars.AZURE_RESOURCE_GROUP }}" \
            --query properties.configuration.ingress.fqdn -o tsv)
          # The first revision downloads the 639 MB official Qwen3 Q8 model.
          # Later revisions reuse the persisted files and become ready much faster.
          curl --fail --retry 30 --retry-delay 10 --retry-all-errors "https://${FQDN}/ready"

  deploy-frontend:
    name: Deploy frontend to Azure Static Web Apps
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: [backend-tests, frontend-tests, deploy-backend]
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - name: Stage frontend in a space-free build path
        run: cp -R "job portal frontend" frontend
      - name: Build and deploy hybrid Next.js frontend
        uses: azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: upload
          app_location: frontend
          api_location: ""
          output_location: ""
        env:
          NEXT_PUBLIC_API_URL: ${{ vars.NEXT_PUBLIC_API_URL }}
          INTERNAL_API_URL: ${{ vars.NEXT_PUBLIC_API_URL }}
          NEXT_PUBLIC_SITE_URL: ${{ vars.NEXT_PUBLIC_SITE_URL }}
