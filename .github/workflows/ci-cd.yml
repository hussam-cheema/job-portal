name: CI and production deployment

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-tests:
    name: Backend tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: job portal backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: job portal backend/requirements.txt
      - run: pip install -r requirements.txt
      - run: pytest -q

  frontend-tests:
    name: Frontend lint and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: job portal frontend
    env:
      NEXT_PUBLIC_API_URL: http://127.0.0.1:4010
      INTERNAL_API_URL: http://127.0.0.1:4010
      NEXT_PUBLIC_SITE_URL: http://localhost:3000
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: job portal frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - name: Install dashboard smoke-test browser
        run: npx playwright install --with-deps chromium
      - name: Smoke-test every admin dashboard route
        run: npm run test:e2e

  deploy-frontend:
    name: Deploy frontend to Azure Static Web Apps
    if: >-
      always() &&
      github.event_name != 'pull_request' &&
      github.ref == 'refs/heads/main' &&
      needs.backend-tests.result == 'success' &&
      needs.frontend-tests.result == 'success'
    needs: [backend-tests, frontend-tests]
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - name: Stage frontend in a space-free build path
        run: cp -R "job portal frontend" frontend
      - name: Build and deploy hybrid Next.js frontend
        uses: azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: upload
          app_location: frontend
          api_location: ""
          output_location: ""
        env:
          NEXT_PUBLIC_API_URL: ${{ vars.NEXT_PUBLIC_API_URL }}
          INTERNAL_API_URL: ${{ vars.NEXT_PUBLIC_API_URL }}
          NEXT_PUBLIC_SITE_URL: ${{ vars.NEXT_PUBLIC_SITE_URL }}
