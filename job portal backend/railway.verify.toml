[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile.railway"
watchPatterns = [
  "/job portal backend/app/**",
  "/job portal backend/migration/export_railway_env.py",
  "/job portal backend/migration/verify_production.py",
  "/job portal backend/config.yaml",
  "/job portal backend/requirements.txt",
  "/job portal backend/Dockerfile.railway",
  "/job portal backend/railway.verify.toml",
]

[deploy]
startCommand = "python -u migration/verify_production.py"
restartPolicyType = "NEVER"
