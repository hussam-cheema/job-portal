# Job Portal Configuration (manual admin posting)

# Railway deployment marker: loads repository-root-relative monorepo watch paths.
site:
  name: "Pakistan Jobs Market"
  title: "Pakistan Jobs Market"
  header: "Latest government & private job openings in Pakistan"
  url: "https://pakistanjobsmarket.com"  # used for SEO + image watermark text
  description: "Discover current government and private jobs across Pakistan, search opportunities by city and category, get instant job alerts, and use practical career tools."
  footer_copyright: "Copyrights © {year} - Pakistan Jobs Market. All rights reserved."

database:
  echo: false
  pool_size: 5

# Cloudflare R2 for job description images and attachments.
# Credentials and the public custom domain are configured through R2_* environment variables.
# Layout: {prefix}/{job_uuid}/images|attachments/{file}
r2:
  enabled: true
  bucket: ""  # R2_BUCKET_NAME in .env
  public_base_url: ""  # R2_PUBLIC_BASE_URL in .env
  prefix: "job-portal"
  max_attachment_count: 3
  max_attachment_mb: 15
  max_image_mb: 8

watermark:
  enabled: true
  text: "Pakistan Jobs Market"
  color: "#FF0000"
  opacity: 0.32
  position: "center"
  font_scale: 0.075

branding:
  max_logo_mb: 2

analytics:
  timezone: "Asia/Karachi"
  trust_proxy_headers: true
  geolocation_enabled: true
  geolocation_url: "https://ipwho.is/{ip}"
  # Country-only fallback prevents a transient/rate-limited primary lookup from
  # permanently recording otherwise valid Railway visits as Unknown.
  geolocation_fallback_url: "https://api.country.is/{ip}"
  geolocation_timeout_seconds: 4
  geolocation_cache_seconds: 86400

llm:
  temperature: 0.1
  max_tokens: 4096
  tasks:
    qna_extraction:
      provider: deepseek
      model: "DeepSeek-V4.1-Flash-1017"
      # Keep the dated release label for audit while using DeepSeek's stable
      # Flash alias so new Flash releases are picked up without a code change.
      api_model: "deepseek-v4-flash"
      thinking: true
      response_format: json_object
      empty_response_retries: 1
      fallback: [openai, grok, ollama, glm, meta, claude]
  providers:
    grok:
      enabled: false
      model: "grok-3-mini"
    openai:
      enabled: false
      model: "gpt-4o-mini"
    deepseek:
      enabled: true
      model: "DeepSeek-V4.1-Flash-1017"
      api_model: "deepseek-v4-flash"
    meta:
      enabled: false
      model: "meta-llama/Llama-3.3-70B-Instruct-Turbo"
    glm:
      enabled: false
      model: "glm-5.2"
    ollama:
      enabled: false
      model: "llama3.2"
    claude:
      enabled: false
      model: "claude-3-5-haiku-latest"

youtube_qna:
  enabled: true
  max_qna: 20
  # Permit several genuinely different questions within a broad topic (for
  # example maximum age, age relaxation, and post-specific age limits) while
  # still removing semantic duplicates.
  max_qna_per_topic: 4
  # Search the five newest YouTube candidates for the job title.
  max_youtube_search_results: 5
  # Retain at most five recent titles that pass the semantic/title-keyword score.
  max_youtube_videos: 5
  max_comments: 50
  # Keep every available reply beneath each selected top-level comment so
  # English, Urdu, and Roman-Urdu questions retain their answer hierarchy.
  extract_transcripts: true
  extract_comments: true
  # When captions are missing, download a bounded public audio stream and use
  # the configured OpenAI transcription endpoint to create the script. Q&A
  # extraction itself remains on the configured DeepSeek Flash model.
  transcribe_audio_when_captions_missing: true
  audio_transcription_model: "gpt-4o-mini-transcribe"
  audio_transcription_timeout_seconds: 120
  max_transcription_audio_bytes: 24000000
  ai_timeout_seconds: 100
  source_timeout_seconds: 180
  source_collection_timeout_seconds: 180
  source_workers: 5
  # Require at least 80% raw embedding cosine similarity by default. The admin
  # input can override this with any whole percentage from 1 to 100.
  min_title_similarity: 0.8
  # YOUTUBE_API_KEY in .env

# Semantic embeddings used to compare job titles with YouTube titles.
embeddings:
  provider: openai
  model: "text-embedding-3-large"
  dimensions: 1536
  timeout_seconds: 30
  fallback_provider: qwen3
  fallback_model: "Qwen/Qwen3-Embedding-0.6B"
  # Official Q8 GGUF runtime. The 639 MB model fits the existing 1 GiB
  # Container App; the 1.2 GB f16 checkpoint does not.
  local_runtime_repository: "Qwen/Qwen3-Embedding-0.6B-GGUF"
  local_model_filename: "Qwen3-Embedding-0.6B-Q8_0.gguf"
  local_model_path: "/models/Qwen3-Embedding-0.6B-Q8_0.gguf"
  local_max_length: 512
  local_batch_tokens: 128
  local_threads: 1

# Auth credentials: ADMIN_USERNAME / ADMIN_PASSWORD / JWT_SECRET in .env only
auth:
  jwt_expire_hours: 72

contact:
  max_name_len: 50
  max_subject_len: 50
  max_email_len: 100
  max_message_len: 300
  max_messages_per_day: 50
  max_per_ip_per_hour: 5
  max_per_email_per_day: 3

seo:
  default_robots: "index,follow"
  auto_generate: true
  twitter_card: "summary_large_image"
  organization_name: "Pakistan Jobs Market"
  organization_logo: ""

logging:
  level: "INFO"
