# Job Portal Configuration (manual admin posting)

site:
  name: "PakJobs"
  title: "PakJobs Jobs in Pakistan"
  header: "Latest government & private job openings in Pakistan"
  url: "https://pakjobs.example.com"  # used for SEO + image watermark text
  description: "Hover a job for a summary, then open the full page for complete details and available interview Q&A."
  footer_copyright: "Copyrights © {year} - PakistanJobs All rights reserved"

database:
  echo: false
  pool_size: 5

# Cloudflare R2 for job description images and attachments.
# Credentials and the public custom domain are configured through R2_* environment variables.
# Layout: {prefix}/{job_uuid}/images|attachments/{file}
r2:
  enabled: true
  bucket: ""  # R2_BUCKET_NAME in .env
  public_base_url: ""  # R2_PUBLIC_BASE_URL in .env
  prefix: "job-portal"
  max_attachment_count: 3
  max_attachment_mb: 15
  max_image_mb: 8

watermark:
  enabled: true
  text: "PakistanJobs"
  color: "#FF0000"
  opacity: 0.32
  position: "center"
  font_scale: 0.075

branding:
  max_logo_mb: 2

analytics:
  trust_proxy_headers: true
  geolocation_enabled: true
  geolocation_url: "https://ipwho.is/{ip}"
  geolocation_timeout_seconds: 4

llm:
  temperature: 0.1
  max_tokens: 4096
  tasks:
    qna_extraction:
      provider: deepseek
      model: deepseek-v4-pro
      # Structured extraction is faster and more reliable without spending the
      # output budget on V4's default thinking trace.
      thinking: false
      response_format: json_object
      empty_response_retries: 1
      fallback: [openai, grok, ollama, glm, meta, claude]
  providers:
    grok:
      enabled: false
      model: "grok-3-mini"
    openai:
      enabled: false
      model: "gpt-4o-mini"
    deepseek:
      enabled: true
      model: "deepseek-v4-pro"
    meta:
      enabled: false
      model: "meta-llama/Llama-3.3-70B-Instruct-Turbo"
    glm:
      enabled: false
      model: "glm-5.2"
    ollama:
      enabled: false
      model: "llama3.2"
    claude:
      enabled: false
      model: "claude-3-5-haiku-latest"

youtube_qna:
  enabled: true
  max_qna: 20
  # Permit several genuinely different questions within a broad topic (for
  # example maximum age, age relaxation, and post-specific age limits) while
  # still removing semantic duplicates.
  max_qna_per_topic: 4
  # Search this many YouTube candidates before embedding-based ranking.
  max_youtube_search_results: 50
  # Retain at most this many ranked titles at/above min_title_similarity.
  max_youtube_videos: 10
  max_comments: 50
  # Keep top-level YouTube comments together with their replies so English,
  # Urdu, and Roman-Urdu questions can be paired with real source answers.
  max_comment_reply_threads: 12
  max_replies_per_thread: 10
  extract_transcripts: true
  extract_comments: true
  timeout_seconds: 120
  ai_timeout_seconds: 120
  source_timeout_seconds: 60
  source_collection_timeout_seconds: 60
  source_workers: 5
  # Calibrated embedding + role-token similarity cutoff for retaining a YouTube
  # title. Lower values broaden the match; higher values are stricter. This remains
  # the single threshold controlling which ranked titles enter source collection.
  min_title_similarity: 0.35
  # YOUTUBE_API_KEY in .env

# Semantic embeddings used to compare job titles with YouTube titles.
embeddings:
  provider: openai
  model: "text-embedding-3-large"
  dimensions: 1536
  timeout_seconds: 30
  fallback_provider: qwen3
  fallback_model: "Qwen/Qwen3-Embedding-0.6B"
  # Official Q8 GGUF runtime. The 639 MB model fits the existing 1 GiB
  # Container App; the 1.2 GB f16 checkpoint does not.
  local_runtime_repository: "Qwen/Qwen3-Embedding-0.6B-GGUF"
  local_model_filename: "Qwen3-Embedding-0.6B-Q8_0.gguf"
  local_model_path: "/models/Qwen3-Embedding-0.6B-Q8_0.gguf"
  local_max_length: 512
  local_batch_tokens: 128
  local_threads: 1

# Auth credentials: ADMIN_USERNAME / ADMIN_PASSWORD / JWT_SECRET in .env only
auth:
  jwt_expire_hours: 72

contact:
  max_name_len: 50
  max_subject_len: 50
  max_email_len: 100
  max_message_len: 300
  max_messages_per_day: 50
  max_per_ip_per_hour: 5
  max_per_email_per_day: 3

seo:
  default_robots: "index,follow"
  auto_generate: true
  twitter_card: "summary_large_image"
  organization_name: "PakJobs"
  organization_logo: ""

logging:
  level: "INFO"
