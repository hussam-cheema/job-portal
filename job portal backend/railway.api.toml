[build]
# Deployment marker: core tool records now commit before legacy repair tasks.
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile.railway"
watchPatterns = [
  "/job portal backend/app/**",
  "/job portal backend/config.yaml",
  "/job portal backend/requirements.txt",
  "/job portal backend/Dockerfile.railway",
  "/job portal backend/railway.api.toml",
]

[deploy]
healthcheckPath = "/ready"
healthcheckTimeout = 300
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10
overlapSeconds = 30
drainingSeconds = 30

[deploy.multiRegionConfig.asia-southeast1-eqsg3a]
numReplicas = 1
