[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"
watchPatterns = [
  "/job portal backend/app/**",
  "/job portal backend/config.yaml",
  "/job portal backend/requirements.txt",
  "/job portal backend/Dockerfile",
  "/job portal backend/railway.newsletter.toml",
]

[deploy]
startCommand = "python -m app.commands.newsletter_retry"
cronSchedule = "*/15 * * * *"
restartPolicyType = "NEVER"
